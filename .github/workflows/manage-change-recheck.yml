name: Manage Change Recheck

# Re-runs the failed `manage-change-check` workflow when a maintainer comments
# `/recheck` on a PR. Useful when the original 15-minute poll window elapsed
# before the dev updated the Manage Change with the PR URL.
#
# Setup & tokens (gate token, ITGC_BASE_URL, branch protection):
#   see ../MANAGE_CHANGE_GATE.md
#
# Uses GitHub's rerun-failed-jobs API so the re-run is bound to the PR's head
# commit — branch protection sees the updated status correctly. No PAT needed;
# the default GITHUB_TOKEN with `actions: write` is sufficient.

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: read

jobs:
  recheck:
    name: Re-run manage-change-check
    runs-on: ubuntu-latest
    # Only a comment on a PR (not a plain issue), starting with `/recheck`, AND
    # from someone with write access to the repo. author_association is OWNER for
    # the repo owner, MEMBER for org members, and COLLABORATOR for users granted
    # write — anyone else (CONTRIBUTOR / FIRST_TIME_CONTRIBUTOR / NONE) is ignored,
    # so a random PR commenter cannot trigger reruns against the gated branches.
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/recheck') &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    steps:
      - name: Re-run failed jobs of latest manage-change-check
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;

            // Fetch the PR to get its head SHA and base branch.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // No hardcoded branch list here: whether a branch is gated is decided
            // solely by on.pull_request.branches in manage-change-check.yml. If a
            // check run exists for this PR's head SHA, the branch is gated and we
            // re-run it; if not, the PR isn't gated (or hasn't run yet) and we exit
            // quietly. This way adding/removing environments touches only that one
            // branch list — never this file.
            const { data: runsResp } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'manage-change-check.yml',
              head_sha: pr.head.sha,
              per_page: 1,
            });

            const latest = runsResp.workflow_runs[0];
            if (!latest) {
              core.info(`No manage-change-check run found for SHA ${pr.head.sha} — branch '${pr.base.ref}' is not gated, or no run yet (push a commit to trigger one). Ignoring /recheck.`);
              return;
            }

            core.info(`Found run ${latest.id} (status=${latest.status}, conclusion=${latest.conclusion}).`);

            // rerun-failed-jobs only works on completed runs with failed jobs.
            // If the run already succeeded or is still running, nothing to do.
            if (latest.status !== 'completed') {
              core.info('Latest run is still in progress — leaving it to finish.');
              return;
            }
            if (latest.conclusion === 'success') {
              core.info('Latest run already succeeded — nothing to re-run.');
              return;
            }

            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: latest.id,
            });

            core.info(`Re-ran failed jobs of run ${latest.id}.`);
